name: MLB Daily Auto Update

on:
  schedule:
    # 01:00 UTC = 09:00 台北時間(早上第一次更新)
    - cron: '0 1 * * *'
    # 14:00 UTC = 22:00 台北時間(晚上補一次,這時候先發投手名單通常更完整)
    - cron: '0 14 * * *'
  workflow_dispatch: {}   # 允許在 Actions 頁面手動點按鈕觸發,方便測試

permissions:
  contents: write   # 需要寫入權限才能把結果 commit 回這個 repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compute Taipei-time dates
        id: dates
        run: |
          # 美國比賽在台北時間是「當天深夜到隔天中午」才打,所以預測的是台北時間「今天」這個日期的賽程
          # (例如台北 9/28 早上 9 點,下一批還沒開打的比賽就是 MLB 賽程日期 9/28)
          echo "today=$(TZ='Asia/Taipei' date +%F)" >> "$GITHUB_OUTPUT"
          echo "now=$(TZ='Asia/Taipei' date +'%Y-%m-%d %H:%M %Z')" >> "$GITHUB_OUTPUT"

      - name: Ensure docs folder exists
        run: mkdir -p docs

      - name: Run prediction for the upcoming MLB slate
        run: |
          python mlb_predictor.py --live --date "${{ steps.dates.outputs.today }}" \
            --html docs/report.html --no-open

      - name: Verify all past predictions (per-day detail pages + cumulative stats)
        run: |
          # 一次把「所有」有預測記錄的日期都拿去對實際比分:
          #   docs/verify/<日期>.html  每一天各自保留一份逐場明細
          #   docs/stats.html          累積命中率,日期可點進明細
          #   docs/verify_report.html  最近一個比賽已全部打完的日期
          python mlb_predictor.py --stats --html docs/stats.html --no-open \
            --detail-dir docs/verify --latest-verify docs/verify_report.html \
            || echo "核對步驟失敗(可能是MLB API暫時連不上),下次排程會再試"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history docs
          git diff --cached --quiet || git commit -m "Auto update: ${{ steps.dates.outputs.now }}"
          git push
